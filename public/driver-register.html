<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Registration - E-Bus</title><link rel="stylesheet" href="driver.css"><style>.register-card{width:min(100%,520px)}.register-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.register-grid label:last-of-type{grid-column:1/-1}.register-card button{margin-top:8px;width:100%}.register-card a{display:block;text-align:center;margin-top:16px;color:#2d6a5d}@media(max-width:600px){.register-grid{grid-template-columns:1fr}.register-grid label:last-of-type{grid-column:auto}}</style></head>
<body><main class="login-view"><form id="registerForm" class="card login-card register-card"><h1>Driver Registration</h1><p>Create your driver account. An administrator must assign your bus before you can use the dashboard.</p><div class="register-grid"><label>First Name<input id="firstName" required></label><label>Last Name<input id="lastName" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" required></label><label>Travel Agency<input id="travelAgency" required></label><label>Password<input id="password" type="password" minlength="6" required></label></div><p id="registerMessage" class="message"></p><button>Register</button><a href="/driver-dashboard.html">Already registered? Driver Login</a></form></main><script src="driver-register.js"></script></body></html>
